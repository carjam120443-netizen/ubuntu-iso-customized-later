name: Build Custom Ubuntu ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config/**'
      - '.github/workflows/build-ubuntu-iso.yml'

permissions:
  contents: read

env:
  UBUNTU_CODENAME: noble
  UBUNTU_MIRROR: http://archive.ubuntu.com/ubuntu
  ISO_NAME: carson-ubuntu-custom

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ISO build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            live-build \
            debootstrap \
            xorriso \
            squashfs-tools \
            syslinux \
            syslinux-common \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools

      - name: Prepare live-build configuration
        run: |
          rm -rf build
          mkdir -p build
          cd build

          lb config \
            --mode ubuntu \
            --architecture amd64 \
            --distribution "${UBUNTU_CODENAME}" \
            --archive-areas "main restricted universe multiverse" \
            --mirror-bootstrap "${UBUNTU_MIRROR}" \
            --mirror-chroot "${UBUNTU_MIRROR}" \
            --mirror-binary "${UBUNTU_MIRROR}" \
            --debian-installer false \
            --binary-images iso-hybrid \
            --syslinux-theme live-build \
            --bootappend-live "boot=live components username=carson hostname=carson-ubuntu" \
            --apt-recommends true \
            --memtest none

      - name: Add customizable package list
        run: |
          mkdir -p build/config/package-lists
          if [ -f config/packages.list.chroot ]; then
            cp config/packages.list.chroot build/config/package-lists/custom.list.chroot
          fi

      - name: Add customization hooks
        run: |
          mkdir -p build/config/hooks/live
          if [ -d config/hooks ]; then
            find config/hooks -type f -name '*.hook.chroot' -exec chmod +x {} +
            find config/hooks -type f -name '*.hook.chroot' -exec cp {} build/config/hooks/live/ \;
          fi

      - name: Add custom files
        run: |
          if [ -d config/includes.chroot ]; then
            mkdir -p build/config/includes.chroot
            cp -a config/includes.chroot/. build/config/includes.chroot/
          fi

      - name: Validate package list
        run: |
          echo 'Packages requested by the custom image:'
          sed '/^[[:space:]]*#/d;/^[[:space:]]*$/d' config/packages.list.chroot | sort -u

      - name: Build ISO
        working-directory: build
        run: |
          sudo lb clean --purge
          sudo lb build

      - name: Verify generated kernel and ISO
        run: |
          test -f build/chroot/boot/vmlinuz || true
          find build -maxdepth 2 -type f \( -name 'vmlinuz*' -o -name 'initrd*' -o -name '*.iso' \) -ls || true

      - name: Rename ISO and generate checksum
        run: |
          ISO=$(find build -maxdepth 1 -type f -name '*.iso' -print -quit)
          test -n "$ISO"
          cp "$ISO" "${ISO_NAME}.iso"
          sha256sum "${ISO_NAME}.iso" > "${ISO_NAME}.iso.sha256"
          ls -lh "${ISO_NAME}.iso" "${ISO_NAME}.iso.sha256"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ISO_NAME }}
          path: |
            ${{ env.ISO_NAME }}.iso
            ${{ env.ISO_NAME }}.iso.sha256
          if-no-files-found: error
          retention-days: 14
